name: Build RAG Service

on:
  push:
    branches: [ "main" ]
    #tags: [ "v*.*.*" ]

jobs:
  build-image:
    runs-on:
      - self-hosted
      - ${{ vars.RUNNER_LABEL }}

    permissions:
      contents: read
      packages: write

    steps:
      # 1. Download repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # TODO: Add test and lint steps before building/pushing the image.
      # This workflow currently only builds and publishes the Docker image to GHCR.

      # 2. Set up Buildx (Docker's modern build engine required for cache & multi-platform)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Extract Docker image metadata and tags
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      # 5. Build and push the image using GitHub Actions native caching
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockers/Dockerfile.rag
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

